    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16518f"/>
      <stop offset="1" stop-color="#0e2a59"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(980 90) rotate(130) scale(560)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2f8bd6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2f8bd6" stop-opacity="0"/>
